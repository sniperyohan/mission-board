<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏅 어와나 점수판</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;
  background:#030616;color:#fff;min-height:100vh;padding:16px;transition:.25s}
h1{text-align:center;font-size:clamp(22px,3.4vw,42px);margin:6px 0 14px;
  text-shadow:0 0 20px #6ea8ff}
#setup{max-width:560px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.row label{width:78px;font-weight:800;font-size:15px}
input,select{flex:1;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);color:inherit;font-size:16px;font-weight:700}
.btn{border:none;border-radius:14px;padding:12px 20px;font-size:16px;font-weight:800;
  background:rgba(255,255,255,.16);color:inherit;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.3)}
.btn.go{background:linear-gradient(90deg,#3d8bff,#6ea8ff);color:#fff;width:100%;margin-top:8px;font-size:18px}
#bigWrap{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  max-width:1500px;margin:0 auto}
#bigWrap[data-n="5"],#bigWrap[data-n="6"]{grid-template-columns:repeat(3,1fr)}
.big{border:3px solid;border-radius:20px;padding:14px;text-align:center;
  background:rgba(255,255,255,.05);position:relative}
.big.lead{box-shadow:0 0 26px rgba(255,201,60,.55)}
.bn{font-size:clamp(18px,2.2vw,30px);font-weight:900;margin-bottom:2px}
.bs{font-size:clamp(38px,5.4vw,72px);font-weight:900;line-height:1.05;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips button{border:none;border-radius:11px;padding:8px 12px;font-size:14px;font-weight:800;
  background:rgba(255,255,255,.16);color:inherit;cursor:pointer}
.chips button:hover{background:rgba(255,255,255,.32)}
.edit{display:flex;gap:6px;justify-content:center;margin-top:8px}
.edit button{border:1px dashed rgba(255,201,60,.7);background:transparent;color:#ffc93c;
  border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;cursor:pointer}
#tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0 8px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:12px 22px;
  border-radius:14px;background:rgba(0,0,0,.8);font-size:17px;font-weight:800;
  opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1}
body.soft{background:#fdf6e6;color:#3b3226}
body.soft h1{text-shadow:none;color:#7a5a12}
body.soft input,body.soft select{background:#fffdf6;border-color:#e0d3b0;color:#3b3226}
body.soft .btn,body.soft .chips button{background:#f0e4c6;color:#3b3226}
body.soft .btn:hover,body.soft .chips button:hover{background:#e6d6ad}
body.soft .big{background:#fffdf6}
body.soft .edit button{border-color:#c08a2a;color:#a8761d}
body.soft #toast{background:rgba(80,64,32,.9);color:#fff}
</style></head><body>

<h1>🏆 어와나 점수판</h1>

<div id="setup">
  <div class="row"><label>팀 수</label>
    <select id="cnt"></select></div>
  <div id="names"></div>
  <button class="btn go" onclick="start()">시작하기 →</button>
</div>

<div id="game" style="display:none">
  <div id="bigWrap"></div>
  <div id="tools">
    <button class="btn" onclick="undo()">↩️ 되돌리기</button>
    <button class="btn" onclick="hardReset()">🔄 처음부터</button>
    <button class="btn" onclick="toggleTheme()" id="thBtn">🌙 다크</button>
    <button class="btn" onclick="full()">⛶ 전체화면</button>
  </div>
</div>

<div id="toast"></div>

<script>
const PAL=["#ff5252","#3d8bff","#ffc93c","#31c46b","#b06bff","#ff7ab8"];
const EMO=['🚀','🦁','🐧','🐯','🦊','🐻'];
const BTNS=[{label:"🏆 1000",pt:1000},{label:"🥈 500",pt:500},{label:"🥉 300",pt:300},
  {label:"📣 응원왕 200",pt:200},{label:"🙌 발표 100",pt:100},{label:"🧹 질서 100",pt:100},
  {label:"＋10",pt:10},{label:"－10",pt:-10}];
let teams=[],hist=[];

/* 소리 */
let AC=null;
function beep(f=880,d=.1,t='triangle',v=.13){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;
  g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;
  t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1400)}

/* 설정 화면 */
const sel=document.getElementById('cnt');
for(let i=2;i<=6;i++)sel.innerHTML+=`<option value="${i}"${i===4?' selected':''}>${i}팀</option>`;
sel.onchange=drawNames;
function drawNames(){
  const n=+sel.value,box=document.getElementById('names');box.innerHTML='';
  for(let i=0;i<n;i++)box.innerHTML+=
    `<div class="row"><label>${EMO[i]} ${i+1}팀</label>
     <input id="nm${i}" value="${i+1}팀" maxlength="10"></div>`;
}
drawNames();

function start(){
  const n=+sel.value;teams=[];
  for(let i=0;i<n;i++)teams.push({
    name:document.getElementById('nm'+i).value.trim()||(i+1)+'팀',
    color:PAL[i],emoji:EMO[i],score:0});
  hist=[];save();
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='block';
  build();beep(880,.12);
}

/* 저장 */
function save(){localStorage.setItem('sb_teams',JSON.stringify(teams))}
function load(){
  const s=localStorage.getItem('sb_teams');if(!s)return false;
  try{teams=JSON.parse(s);return teams.length>0}catch(e){return false}
}

/* 점수판 */
function leader(){const m=Math.max(...teams.map(t=>t.score));return m>0?m:-1}
function build(){
  const w=document.getElementById('bigWrap'),ld=leader();
  w.innerHTML='';w.dataset.n=teams.length;
  teams.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='big'+(t.score===ld?' lead':'');d.style.borderColor=t.color;
    d.innerHTML=`<div class="bn" style="color:${t.color}">${t.score===ld?'👑 ':''}${t.emoji} ${t.name}</div>
      <div class="bs">${t.score}</div><div class="chips"></div>
      <div class="edit">
        <button onclick="manual(${i})">✏️ 직접 입력</button>
        <button onclick="zero(${i})">0점으로</button>
      </div>`;
    const ch=d.querySelector('.chips');
    BTNS.forEach(b=>{const btn=document.createElement('button');
      btn.textContent=b.label;btn.onclick=()=>add(i,b.pt);ch.appendChild(btn)});
    w.appendChild(d);
  });
}
function countUp(el,from,to){
  const st=performance.now(),dur=600;
  (function tick(now){
    const p=Math.min(1,(now-st)/dur);
    el.textContent=Math.round(from+(to-from)*p);
    if(p<1)requestAnimationFrame(tick);
  })(st);
}
function add(i,pt){
  const from=teams[i].score;
  hist.push({i,pt});teams[i].score+=pt;save();
  const cards=document.querySelectorAll('.big');
  if(cards[i])countUp(cards[i].querySelector('.bs'),from,teams[i].score);
  beep(pt>0?1046:392,.14,'triangle',.14);
  setTimeout(build,620);
}
function undo(){
  if(!hist.length){toast('되돌릴 게 없어요');return}
  const h=hist.pop();teams[h.i].score-=h.pt;save();build();
  beep(400,.15,'sine',.12);toast('되돌렸어요');
}
function manual(i){
  const t=teams[i];
  const v=prompt(`${t.name} 에게 줄 점수를 입력하세요.\n(빼려면 -50 처럼 마이너스)`,"100");
  if(v===null)return;
  const p=parseInt(v,10);
  if(isNaN(p)){toast('숫자를 입력해 주세요');return}
  add(i,p);
}
function zero(i){
  const t=teams[i];
  if(t.score===0)return;
  if(!confirm(`${t.name} 의 점수를 0점으로 되돌릴까요?\n(현재 ${t.score}점)`))return;
  add(i,-t.score);
}
function hardReset(){
  if(!confirm('점수를 모두 지우고 팀 설정부터 다시 할까요?'))return;
  localStorage.removeItem('sb_teams');location.reload();
}
function full(){
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}

/* 테마 */
function setTheme(soft){
  document.body.classList.toggle('soft',soft);
  document.getElementById('thBtn').textContent=soft?'🌙 다크':'☀️ 밝게';
  localStorage.setItem('sb_theme',soft?'soft':'dark');
}
function toggleTheme(){setTheme(!document.body.classList.contains('soft'))}
setTheme(localStorage.getItem('sb_theme')!=='dark');

/* 새로고침해도 유지 */
if(load()){
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='block';
  build();
}

addEventListener('keydown',e=>{
  if(e.key==='z'||e.key==='Z')undo();
  if(e.key==='f'||e.key==='F')full();
});
</script></body></html>
