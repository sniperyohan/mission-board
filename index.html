<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세계로 가는 비행기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;
  background:radial-gradient(ellipse at top,#1b2a6b 0%,#0a1030 60%,#05081c 100%);
  color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column;user-select:none}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,4px)}
 40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,4px)}}
body.shake{animation:shake .4s}
#stars,#fx{position:fixed;inset:0;pointer-events:none}
#stars{opacity:.55;z-index:0}#fx{z-index:60}

header{text-align:center;padding:6px 0 2px;z-index:2}
h1{font-size:clamp(18px,2.4vw,32px);letter-spacing:2px;text-shadow:0 0 18px #6ea8ff,0 0 40px #2b5bd7}
#round{font-size:clamp(11px,1.25vw,16px);color:#9fc4ff}
#round b{color:#ffd66b}

#board{flex:1;position:relative;margin:5px 205px 4px 12px;display:grid;gap:5px;z-index:1}
.tile{border-radius:12px;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:clamp(9px,.95vw,14px);color:#cfe0ff;position:relative;overflow:hidden}
.tile .num{position:absolute;top:2px;left:5px;font-size:9px;opacity:.28}
.tile.country{background:linear-gradient(160deg,#ffd66b,#ff9f1c);border-color:#fff3c4;
  color:#4a2800;font-weight:800;box-shadow:0 0 18px rgba(255,180,60,.45)}
.tile.start{background:linear-gradient(160deg,#7bffb0,#14b86a);border-color:#d6ffe8;color:#04371f;font-weight:800}
.tile.goal{background:linear-gradient(160deg,#ff9ad5,#e0308f);color:#43002a;font-weight:800;
  border-color:#ffd9ef;animation:glow 1.4s infinite alternate}
@keyframes glow{from{box-shadow:0 0 14px rgba(255,80,180,.5)}to{box-shadow:0 0 40px rgba(255,120,210,.95)}}
.tile.visited::after{content:"💛";position:absolute;bottom:1px;right:4px;font-size:13px}

.flagwrap{display:block;line-height:0}
.flagwrap img{width:clamp(30px,3.4vw,58px);aspect-ratio:3/2;object-fit:cover;
  border-radius:4px;border:1px solid rgba(0,0,0,.35);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.flagwrap b{display:none;font-size:clamp(13px,1.6vw,22px);letter-spacing:1px;line-height:1.1}
.flagwrap.noimg img{display:none}.flagwrap.noimg b{display:inline-block}

.token{position:absolute;width:40px;height:40px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;border:3px solid #fff;
  box-shadow:0 4px 14px rgba(0,0,0,.6);z-index:5;
  transition:left .28s cubic-bezier(.34,1.56,.64,1),top .28s cubic-bezier(.34,1.56,.64,1)}
.token span{font-size:21px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
.token.hop{transform:scale(1.4)}

#mini{position:fixed;top:6px;right:8px;width:188px;z-index:20;cursor:pointer;
  background:rgba(10,16,48,.85);border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:8px}
#mini:hover{border-color:#7ea8ff;box-shadow:0 0 20px rgba(90,140,255,.6)}
#mini h3{font-size:12px;color:#9fc4ff;text-align:center;margin-bottom:6px;letter-spacing:1px}
.mrow{display:flex;align-items:center;gap:6px;padding:4px 5px;border-radius:9px;margin-bottom:3px}
.mrow .dot{width:12px;height:12px;border-radius:50%;flex:none}
.mrow .mn{flex:1;font-size:13px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mrow .ms{font-size:17px;font-weight:900;color:#ffd66b}
.mrow.lead{background:rgba(255,214,107,.16)}
#mini .tip{text-align:center;font-size:10px;color:#7e93c9;margin-top:4px}

#panel{display:flex;gap:7px;justify-content:center;padding:2px 10px 6px;flex-wrap:wrap;z-index:2}
.card{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);
  border-radius:14px;padding:6px 10px;min-width:140px;text-align:center}
.card.done{opacity:.4}
.card .tname{font-size:clamp(12px,1.3vw,17px);font-weight:800}
.card .pos{font-size:11px;color:#a9c3ff;margin-bottom:4px}
.ranks{display:flex;gap:4px;justify-content:center}
.ranks button{border:none;border-radius:9px;padding:5px 8px;font-size:12px;font-weight:800;
  cursor:pointer;background:#3d5bbf;color:#fff}
.ranks button:hover:not(:disabled){background:#5f7ffb;transform:translateY(-2px)}
.ranks button:disabled{background:#2a3355;color:#666;cursor:default}

#tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  padding:10px 10px 14px;z-index:2;
  border-top:1px solid rgba(255,255,255,.10)}
#tools button{border:none;border-radius:12px;padding:10px 20px;font-size:16px;font-weight:800;
  cursor:pointer;background:rgba(255,255,255,.14);color:#fff}
#tools button:hover{background:rgba(255,255,255,.28)}

.overlay{position:fixed;inset:0;background:rgba(3,6,22,.93);z-index:50;
  display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.overlay.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hint{margin-top:20px;font-size:14px;color:#8fa6d8}

#diceBox{font-size:clamp(90px,16vw,230px);font-weight:900;text-shadow:0 0 40px #ffd66b;line-height:1}
#diceWho{font-size:clamp(19px,2.8vw,38px);margin-bottom:8px}
#diceSub{font-size:clamp(15px,1.9vw,25px);color:#ffd66b;margin-top:6px}

#cardOv .flagwrap img{width:clamp(180px,26vw,330px);border-radius:12px;border:4px solid #fff;
  box-shadow:0 10px 40px rgba(0,0,0,.7)}
#cardOv .flagwrap b{display:none;font-size:90px}
#cardOv .flagwrap.noimg b{display:inline-block;color:#ffd66b}
#cardName{font-size:clamp(30px,5vw,72px);font-weight:900;margin:10px 0 2px}
#cardHi{font-size:clamp(24px,4vw,56px);color:#ffd66b;font-weight:800}
#cardFact{font-size:clamp(15px,1.9vw,27px);color:#cfe0ff;margin-top:12px;max-width:78vw;line-height:1.5}
#cardPray{font-size:clamp(14px,1.6vw,22px);color:#9fe8c0;margin-top:10px}
#winTxt{font-size:clamp(32px,5.5vw,86px);font-weight:900;text-shadow:0 0 30px #ff7ad9,0 0 60px #ff2ea6}

#scoreOv{background:rgba(3,6,22,.97);justify-content:flex-start;padding:18px}
#scoreOv h2{font-size:clamp(22px,3.4vw,44px);margin-bottom:10px;text-shadow:0 0 20px #6ea8ff}
#bigWrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}
.big{background:rgba(255,255,255,.07);border:3px solid;border-radius:22px;
  padding:14px 16px;min-width:225px;flex:1;max-width:325px;transition:transform .15s}
.big.pop{transform:scale(1.06)}
.big.lead{box-shadow:0 0 34px rgba(255,214,107,.6)}
.big .bn{font-size:clamp(18px,2.2vw,29px);font-weight:900;margin-bottom:2px}
.big .bs{font-size:clamp(50px,7.5vw,105px);font-weight:900;line-height:1;color:#ffd66b;
  text-shadow:0 0 26px rgba(255,190,60,.75)}
.big .chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:10px}
.big .chips button{border:none;border-radius:10px;padding:6px 9px;font-size:12px;font-weight:800;
  cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
.big .chips button:hover{background:#5f7ffb;transform:translateY(-2px)}
#scoreTools{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#scoreTools button{border:none;border-radius:12px;padding:9px 18px;font-size:14px;font-weight:800;
  cursor:pointer;background:rgba(255,255,255,.14);color:#fff}
#scoreTools button:hover{background:rgba(255,255,255,.3)}

#setupOv{background:rgba(3,6,22,.98);justify-content:flex-start;padding:22px;overflow:auto}
#setupOv h2{font-size:clamp(24px,3.6vw,46px);margin-bottom:4px;text-shadow:0 0 20px #6ea8ff}
#setupOv p.sub{color:#9fc4ff;margin-bottom:16px;font-size:15px}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:9px;background:rgba(255,255,255,.07);
  border:2px solid rgba(255,255,255,.16);border-radius:14px;padding:8px 10px}
.srow .sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;cursor:pointer;flex:none}
.srow .em{font-size:26px;cursor:pointer;background:none;border:none;width:44px}
.srow input{flex:1;min-width:140px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.2);
  border-radius:10px;color:#fff;font-size:19px;font-weight:800;padding:8px 12px;font-family:inherit}
.srow input:focus{outline:none;border-color:#7ea8ff}
.srow .del{background:none;border:none;color:#ff7a7a;font-size:21px;cursor:pointer}
#setupBtns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
#setupBtns button{border:none;border-radius:14px;padding:12px 26px;font-size:17px;font-weight:900;cursor:pointer}
.bStart{background:linear-gradient(160deg,#7bffb0,#14b86a);color:#04371f}
.bAdd{background:rgba(255,255,255,.16);color:#fff}
.bCont{background:linear-gradient(160deg,#ffd66b,#ff9f1c);color:#4a2800}
  .brand{
    font-size:clamp(34px,5.2vw,72px);
    font-weight:900;
    letter-spacing:-1px;
    text-align:center;
    margin-bottom:6px;
    background:linear-gradient(90deg,#ffd86b,#fff3b0,#ffb347,#ffd86b);
    background-size:250% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 4px 14px rgba(255,190,60,.45));
    animation:brandShine 4s linear infinite, brandPop .8s cubic-bezier(.2,1.4,.4,1) both;
  }
  .brand small{
    display:block;
    font-size:.34em;
    font-weight:700;
    letter-spacing:6px;
    color:#9fb4ff;
    -webkit-text-fill-color:#9fb4ff;
    margin-top:10px;
  }
  @keyframes brandShine{to{background-position:250% 0}}
  @keyframes brandPop{from{opacity:0;transform:scale(.8) translateY(-18px)}to{opacity:1;transform:none}}
  .bigscore{
    justify-content:center;
    align-items:center;
    padding:0;
  }
  .bigscore h2{
    font-size:clamp(36px,4.2vw,64px);
    margin-bottom:30px;
  }
  .bigscore .tcard{ margin:0 18px; }
  .bigscore .tcard{
    padding:44px 60px;
    border-width:6px;
    border-radius:32px;
    min-width:clamp(280px,26vw,420px);
  }
  .bigscore .tname{ font-size:clamp(30px,3.2vw,52px); }
  .bigscore .tscore{
    font-size:clamp(120px,16vw,260px);
    line-height:1;
    margin:10px 0 22px;
  }
  .bigscore button{
    font-size:clamp(14px,1.3vw,20px);
    padding:10px 16px;
  }
  #setupOv{
    justify-content:center;
    align-items:center;
    padding:24px 0;
  }
  #setupOv .brand{ margin-bottom:14px; }
  #setupOv h2{ margin:18px 0 6px; }
  #setupList{ margin-top:22px; }
  #setupList > *{ margin-bottom:16px; }
  body:has(#setupOv.show) header{ display:none; }
  #scoreOv{
    position:fixed; inset:0;
    justify-content:center;
    align-items:center;
    background:#070a16;
    margin:0;
    z-index:50;
    zoom:1.75;
  }
  body:has(#scoreOv.show) header{ display:none; }
  #board img{
    width:clamp(38px,4.4vw,64px) !important;
    height:auto !important;
    border-radius:4px;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  #board .name, #board .cname{
    font-size:clamp(12px,1.15vw,17px) !important;
    font-weight:800;
  }
    @media (max-width:820px){
    #board{ aspect-ratio:auto !important; height:auto !important; }
    #board .tile{ min-height:70px; }
  }
  #cardFlag img{
    object-fit:contain !important;
    width:100% !important;
    height:auto !important;
  }
  #introOv{ background:#000; }
  #introOv video{
    width:min(92vw,1280px);
    max-height:80vh;
    border-radius:16px;
    box-shadow:0 0 60px rgba(255,214,107,.35);
  }
  #introSkip{
    margin-top:18px; border:none; border-radius:14px;
    padding:12px 30px; font-size:17px; font-weight:900; cursor:pointer;
    background:#ffd66b; color:#20242e;
  }
  @keyframes wiggle{
    0%,100%{ transform:rotate(-2deg) scale(1); }
    25%    { transform:rotate(2deg) scale(1.02); }
    50%    { transform:rotate(-1.5deg) scale(1); }
    75%    { transform:rotate(1.5deg) scale(1.02); }
  }
  #setupOv .brand{
    animation:wiggle 2.2s ease-in-out infinite;
    transform-origin:center;
  }
  /* === 우측 사이드바 레이아웃 === */
  body{display:grid !important;grid-template-columns:1fr 270px;
    grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
  header{grid-column:1/-1}
  #board{grid-column:1;grid-row:2;margin:5px 8px 10px 12px !important}
  #rail{grid-column:2;grid-row:2;display:flex;flex-direction:column;
    gap:8px;padding:6px 8px 8px 0;overflow-y:auto}

  #mini{position:static !important;width:auto !important}

  #panel{flex-direction:column;gap:8px;padding:0 !important}
  #panel .card{min-width:0;width:100%;padding:10px}
  #panel .card .tname{font-size:20px}
  #panel .card .pos{font-size:13px}
  #panel .ranks{flex-wrap:wrap;gap:6px}
  #panel .ranks button{font-size:15px;padding:9px 10px;flex:1 1 40%}

  #tools{flex-direction:column;padding:0 !important}
  #tools button{width:100%;font-size:15px;padding:11px 8px}

  @media (max-width:820px){
    body{display:flex !important;flex-direction:column;height:auto;min-height:100vh;overflow-y:auto}
    #rail{overflow:visible}
    #panel{flex-direction:row}
    #tools{flex-direction:row;flex-wrap:wrap}
    #tools button{width:auto}
    /* 보드: 7열 유지 + 화면 폭에 맞춰 자동 축소 */
    #board{margin:6px 6px 8px !important;gap:3px !important;
      grid-template-columns:repeat(7,1fr) !important;
      aspect-ratio:auto !important;height:auto !important}
    #board .tile{min-height:0 !important;aspect-ratio:1/1;padding:2px !important;
      border-radius:8px !important;overflow:hidden}
    #board .tile img{width:74% !important;height:auto !important;margin:0 auto}
    #board .name,#board .cname{font-size:8px !important;line-height:1.1 !important;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #board .tile .num{font-size:7px !important}
    header h1{font-size:17px !important}
    header .sub,#sub{font-size:11px !important}
  }
  /* === 점수판 크게: 5~6팀 대응 === */
  #scoreOv{overflow:hidden!important;padding:8px!important}
  #bigWrap{max-width:100%;max-height:100%}

  #bigWrap[data-n="5"],#bigWrap[data-n="6"]{
    display:grid!important;grid-template-columns:repeat(3,1fr);
    gap:8px!important;width:min(96vw,1180px)}
  #bigWrap[data-n="5"] .big,#bigWrap[data-n="6"] .big{
    margin:0!important;padding:6px 8px!important;min-width:0!important}
  #bigWrap[data-n="5"] .bs,#bigWrap[data-n="6"] .bs{
    font-size:clamp(26px,4.2vh,46px)!important;line-height:1.05!important}
  #bigWrap[data-n="5"] .bn,#bigWrap[data-n="6"] .bn{
    font-size:clamp(14px,2vh,20px)!important}
  #bigWrap[data-n="5"] .chips button,#bigWrap[data-n="6"] .chips button{
    font-size:11px!important;padding:4px 7px!important}

  .big .mbtns{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  .big .mbtns button.manualbtn{
    cursor:pointer;border:none!important;border-radius:9px!important;
    padding:5px 8px!important;font-size:12px!important;font-weight:800!important;
    line-height:1.2!important;white-space:nowrap;width:auto!important;
    margin:0!important;letter-spacing:0!important;
    background:rgba(255,214,107,.16);color:#ffd66b}
  .big .mbtns button.manualbtn:hover{background:rgba(255,214,107,.3)}
  .big .mbtns button.manualbtn.zero{background:rgba(255,255,255,.10);color:#b9c8ee}
  .big .mbtns button.manualbtn.zero:hover{background:rgba(255,120,120,.25);color:#ffd5d5}
  </style>

</head>
<body>
<canvas id="stars"></canvas><canvas id="fx"></canvas>

<header><h1 id="title"></h1><div id="round"></div></header>
<div id="board"></div>
<aside id="rail">
<div id="mini"></div>
<div id="panel"></div>
<div id="tools">
  <button onclick="openScore()">🏅 점수판 크게</button>
  <button onclick="window.open('https://rhythm.chatbotai.co.kr/','_blank')">🥁 몸풀기 게임</button>
  <button onclick="window.open('intro.html','introWin','width=1280,height=760')">🎬 인트로 영상</button>
  <button onclick="alert('📸 사진첩은 준비 중입니다')">📸 사진첩</button>
  <button onclick="window.open('brain.html','brainWin','width=1280,height=900')">🧠 깜짝 두뇌게임</button>
  <button onclick="nextRound()">다음 라운드 ▶</button>
  <button onclick="allFinish()">🎉 다같이 골인!</button>
  <button onclick="askReset()">처음부터</button>
</div>
</aside>

<div class="overlay" id="diceOv">
  <div id="diceWho"></div><div id="diceBox">?</div><div id="diceSub"></div>
</div>
<div class="overlay" id="cardOv">
  <div id="cardFlag"></div><div id="cardName"></div><div id="cardHi"></div>
  <div id="cardFact"></div><div id="cardPray"></div>
  <div class="hint">아무 데나 누르면 계속 갑니다</div>
</div>
<div class="overlay" id="winOv">
  <div style="font-size:clamp(56px,11vw,150px)">🎁</div>
  <div id="winTxt">모두 도착!<br>선물 상자를 열어요!</div>
  <div class="hint">아무 데나 누르면 닫혀요</div>
</div>

<div class="overlay bigscore" id="scoreOv">
  <h2>🏅 우리 팀 점수</h2>
  <div id="bigWrap"></div>
  <div id="scoreTools">
    <button onclick="undo()">↩ 되돌리기</button>
    <button onclick="closeScore()">✕ 보드로 돌아가기</button>
  </div>
</div>
<div class="overlay" id="introOv">
  <video id="introVid" src="video/intro.mp4" playsinline></video>
  <button id="introSkip">▶ 게임 시작하기</button>
</div>
<div class="overlay show" id="setupOv">
  <div class="brand">충현교회 JOY유치부<small>세계로 가는 비행기</small></div>
  <h2>팀을 만들어요</h2>
  <p class="sub">동그라미를 누르면 색, 이모지를 누르면 말 모양이 바뀝니다</p>
  <div id="setupList" style="width:min(560px,92vw)"></div>
  <div id="setupBtns">
    <button class="bAdd" onclick="addTeam()">＋ 팀 추가</button>
    <button class="bStart" onclick="startGame()">시작하기 ✈️</button>
  </div>
  <div id="contWrap"></div>
</div>

<script>
/* ================= 여기만 고치시면 됩니다 ================= */
const CONFIG = {
  title:"✈️ 세계로 가는 비행기",
  cols:7, rows:5,                       // 35칸
  palette:["#ff5252","#3d8bff","#ffc93c","#31c46b","#b06bff","#ff7ab8"],
emojis: ['🚀','🦁','🐧','🐯','🦊','🐻','🕊️','🐑','⭐','🎈'],
  ranks:[
    {label:"1등",dice:[4],bonus:1},
    {label:"2등",dice:[4],bonus:0},
    {label:"3등",dice:[3],bonus:0},
    {label:"4등",dice:[2],bonus:0},
    {label:"5등",dice:[2],bonus:0},
    {label:"6등",dice:[2],bonus:0}
  ],
  scoreButtons:[
    {label:"🏆 1000",pt:1000},{label:"🥈 500",pt:500},{label:"🥉 300",pt:300},
    {label:"📣 응원왕 200",pt:200},{label:"🙌 발표 100",pt:100},{label:"🧹 질서 100",pt:100},
    {label:"＋10",pt:10},{label:"－10",pt:-10}
  ],

const KEY="missionBoard_v2";
/* ========================================================= */

const TOTAL=CONFIG.cols*CONFIG.rows, GOAL=TOTAL-1;
const board=document.getElementById('board'),panel=document.getElementById('panel'),
      mini=document.getElementById('mini'),cardOv=document.getElementById('cardOv');
let state=null,tiles=[],tokens=[],busy=false,history=[],draft=[],cardCB=null;

function flagHTML(code){
  return `<span class="flagwrap"><img src="https://flagcdn.com/w320/${code}.png" alt=""
    onerror="this.parentNode.classList.add('noimg')"><b>${code.toUpperCase()}</b></span>`;
}

/* ---- 배경 별 ---- */
(function(){const c=document.getElementById('stars'),x=c.getContext('2d');
 function d(){c.width=innerWidth;c.height=innerHeight;
  for(let i=0;i<150;i++){x.globalAlpha=Math.random()*.8+.2;x.fillStyle='#fff';
   x.beginPath();x.arc(Math.random()*c.width,Math.random()*c.height,Math.random()*1.7,0,7);x.fill();}}
 d();addEventListener('resize',d);})();

/* ---- 소리 ---- */
let AC;
function beep(f,d,t='square',v=.15){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;
 o.connect(g);g.connect(AC.destination);o.start();
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function fanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.35,'triangle',.2),i*135));}
function buzz(){[300,220].forEach((f,i)=>setTimeout(()=>beep(f,.18,'sawtooth',.12),i*130));}

/* ---- 색종이 ---- */
const fx=document.getElementById('fx'),fc=fx.getContext('2d');
function fxsize(){fx.width=innerWidth;fx.height=innerHeight}fxsize();addEventListener('resize',fxsize);
let parts=[];
function burst(x,y,n=90,cols=['#ffd66b','#ff6b9d','#6bffb0','#6ba8ff','#fff']){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*9;
   parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,g:.32,
    w:5+Math.random()*7,h:8+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.4,
    c:cols[i%cols.length],life:70+Math.random()*40});}
}
(function loop(){fc.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
   fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;
   fc.globalAlpha=Math.max(0,Math.min(1,p.life/40));
   fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);fc.restore();return p.life>0&&p.y<fx.height+40});
  requestAnimationFrame(loop);})();
function shake(){document.body.classList.remove('shake');void document.body.offsetWidth;
  document.body.classList.add('shake');}

/* ---- 팀 설정 ---- */
function drawSetup(){
  const L=document.getElementById('setupList');L.innerHTML='';
  draft.forEach((t,i)=>{
    const r=document.createElement('div');r.className='srow';
    r.innerHTML=`<div class="sw" style="background:${t.color}"></div>
      <button class="em">${t.emoji}</button>
      <input maxlength="8" placeholder="팀 이름" value="${t.name}">
      <button class="del">✕</button>`;
    r.querySelector('.sw').onclick=()=>{t.color=CONFIG.palette[(CONFIG.palette.indexOf(t.color)+1)%CONFIG.palette.length];beep(700,.06,'sine',.1);drawSetup()};
    r.querySelector('.em').onclick=()=>{t.emoji=CONFIG.emojis[(CONFIG.emojis.indexOf(t.emoji)+1)%CONFIG.emojis.length];beep(800,.06,'sine',.1);drawSetup()};
    r.querySelector('input').oninput=e=>t.name=e.target.value;
    r.querySelector('.del').onclick=()=>{if(draft.length>2){draft.splice(i,1);buzz();drawSetup()}};
    L.appendChild(r);
  });
}
function addTeam(){
  if(draft.length>=6)return;
  const i=draft.length;
  draft.push({name:"",color:CONFIG.palette[i%6],emoji:CONFIG.emojis[i%CONFIG.emojis.length]});
  beep(900,.08,'triangle',.13);drawSetup();
}
function startGame(){
  state={round:1,found:[],teams:draft.map((t,i)=>({name:t.name.trim()||`${i+1}팀`,
    color:t.color,emoji:t.emoji,pos:0,score:0,rolled:false}))};
  history=[];
  document.getElementById('setupOv').classList.remove('show');
  buildBoard();buildTokens();refresh();setTimeout(redraw,90);
  save();fanfare();burst(innerWidth/2,innerHeight/2,120);
}

/* ---- 보드 ---- */
let mobileMode=null;
function syncLayout(){
  const m=innerWidth<=820, changed=(m!==mobileMode);
  mobileMode=m;
  CONFIG.cols=m?4:7;
  CONFIG.rows=m?9:5;
  return changed;
}
function tilePos(i){const r=Math.floor(i/CONFIG.cols);let c=i%CONFIG.cols;
  if(r%2===1)c=CONFIG.cols-1-c;return{r,c}}
function countryAt(i){return CONFIG.countries.find(x=>x.tile===i)}
function buildBoard(){
  syncLayout();
  board.innerHTML='';tiles=[];
  board.style.gridTemplateColumns=`repeat(${CONFIG.cols},1fr)`;
  board.style.gridTemplateRows=`repeat(${CONFIG.rows},1fr)`;
  for(let i=0;i<TOTAL;i++){
    const{r,c}=tilePos(i),d=document.createElement('div');
    d.className='tile';d.style.gridRow=r+1;d.style.gridColumn=c+1;
    const ct=countryAt(i);
    if(i===0){d.classList.add('start');d.innerHTML='<div style="font-size:1.6em">🛫</div>출발<br>인천공항';}
    else if(i===GOAL){d.classList.add('goal');d.innerHTML='<div style="font-size:1.6em">🎁</div>골인!';}
    else if(ct){d.classList.add('country');d.innerHTML=flagHTML(ct.code)+`<div>${ct.name}</div>`;}
    else d.innerHTML=`<span class="num">${i}</span>☁️`;
    board.appendChild(d);tiles.push(d);
  }
}
function buildTokens(){
  document.querySelectorAll('.token').forEach(t=>t.remove());
  tokens=state.teams.map(t=>{const e=document.createElement('div');
    e.className='token';e.style.background=t.color;e.innerHTML=`<span>${t.emoji}</span>`;
    board.appendChild(e);return e});
}
function place(i,idx,anim=true){
  const b=board.getBoundingClientRect(),t=tiles[idx].getBoundingClientRect();
  const off=(i-(state.teams.length-1)/2)*13,el=tokens[i];
  if(!anim)el.style.transition='none';
  el.style.left=(t.left-b.left+t.width/2-20+off)+'px';
  el.style.top=(t.top-b.top+t.height/2-20)+'px';
  if(!anim)requestAnimationFrame(()=>el.style.transition='');
}
function redraw(){if(state)state.teams.forEach((t,i)=>place(i,t.pos,false))}
addEventListener('resize',()=>{
  if(state && ((innerWidth<=820)!==mobileMode)){
    buildBoard();buildTokens();
    CONFIG.countries.forEach(c=>{if(state.found.includes(c.code))tiles[c.tile].classList.add('visited')});
    if(state.teams.some(t=>t.pos===GOAL))tiles[GOAL].classList.add('visited');
  }
  setTimeout(redraw,50);
});

/* ---- 갱신 ---- */
function refresh(){buildPanel();buildMini();
  if(document.getElementById('scoreOv').classList.contains('show'))buildBig()}
function leader(){const m=Math.max(...state.teams.map(t=>t.score));return m>0?m:-1}
function buildMini(){
  const ld=leader();
  mini.innerHTML='<h3>🏅 실시간 점수</h3>'+state.teams.map(t=>
    `<div class="mrow ${t.score===ld?'lead':''}"><div class="dot" style="background:${t.color}"></div>
     <div class="mn">${t.score===ld?'👑':''}${t.name}</div><div class="ms">${t.score}</div></div>`).join('')
    +'<div class="tip">눌러서 크게 보기</div>';
}
mini.onclick=openScore;
function buildPanel(){
  panel.innerHTML='';
  state.teams.forEach((t,i)=>{
    const c=document.createElement('div');
    c.className='card'+(t.rolled?' done':'');c.style.borderColor=t.color;
    c.innerHTML=`<div class="tname" style="color:${t.color}">${t.emoji} ${t.name}</div>
      <div class="pos">${t.pos===GOAL?'🎉 도착!':t.pos+' / '+GOAL+' 칸'}</div><div class="ranks"></div>`;
    const rw=c.querySelector('.ranks');
    CONFIG.ranks.slice(0,state.teams.length).forEach((r,ri)=>{const b=document.createElement('button');
      b.textContent=r.label;b.disabled=t.rolled||t.pos===GOAL||busy;b.onclick=()=>roll(i,ri);rw.appendChild(b)});
    panel.appendChild(c);
  });
  document.getElementById('round').innerHTML=
    `${state.round}번째 게임 · 주사위 던진 팀 ${state.teams.filter(t=>t.rolled).length}/${state.teams.length}
     · 🌏 발견한 선교지 <b>${state.found.length} / ${CONFIG.countries.length}</b>`;
}

/* ---- 점수 ---- */
function countUp(el,from,to,dur=650){
  const t0=performance.now();let last=0;
  const tick=t=>{const p=Math.min(1,(t-t0)/dur);
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));
    if(t-last>70){beep(500+Math.random()*500,.05,'square',.08);last=t}
    if(p<1)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}
function addScore(i,pt){
  const t=state.teams[i],from=t.score;
  history.push({i,pt});t.score+=pt;save();
  const cards=document.querySelectorAll('.big');
  if(cards[i]){
    countUp(cards[i].querySelector('.bs'),from,t.score);
    cards[i].classList.add('pop');setTimeout(()=>cards[i].classList.remove('pop'),180);
    const r=cards[i].getBoundingClientRect();
    if(pt>0){burst(r.left+r.width/2,r.top+r.height/2,pt>=50?110:45,[t.color,'#ffd66b','#fff']);
      if(pt>=50)shake();fanfare();}
    else buzz();
  }
  buildMini();
  setTimeout(buildBig,700);
}
function undo(){
  if(!history.length){buzz();return}
  const h=history.pop();state.teams[h.i].score-=h.pt;save();buildBig();buildMini();beep(400,.15,'sine',.12);
}
function buildBig(){
  const w=document.getElementById('bigWrap'),ld=leader();w.innerHTML='';
  w.dataset.n=state.teams.length;
  state.teams.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='big'+(t.score===ld?' lead':'');d.style.borderColor=t.color;
    d.innerHTML=`<div class="bn" style="color:${t.color}">${t.score===ld?'👑 ':''}${t.emoji} ${t.name}</div>
      <div class="bs">${t.score}</div><div class="chips"></div>`;
    const ch=d.querySelector('.chips');
    CONFIG.scoreButtons.forEach(b=>{const btn=document.createElement('button');
      btn.textContent=b.label;btn.onclick=()=>addScore(i,b.pt);ch.appendChild(btn)});
    w.appendChild(d);
  });
}
function openScore(){if(busy)return;buildBig();document.getElementById('scoreOv').classList.add('show');beep(880,.1,'triangle',.13)}
function closeScore(){document.getElementById('scoreOv').classList.remove('show');setTimeout(redraw,60)}

/* ---- 주사위 ---- */
function roll(ti,ri){
  if(busy)return;busy=true;
  const t=state.teams[ti],rk=CONFIG.ranks[ri],ov=document.getElementById('diceOv');
  document.getElementById('diceWho').innerHTML=`<span style="color:${t.color}">${t.emoji} ${t.name}</span> · ${rk.label}`;
  document.getElementById('diceSub').textContent=
    `🎲 ${rk.dice.join('+')}면 주사위`+(rk.bonus?` + 보너스 ${rk.bonus}칸`:'');
  ov.classList.add('show');
  const box=document.getElementById('diceBox');let n=0;
  const sp=setInterval(()=>{
    box.textContent=rk.dice.reduce((s,d)=>s+1+Math.floor(Math.random()*d),0)+rk.bonus;
    beep(300+Math.random()*400,.05,'square',.07);
    if(++n>18){clearInterval(sp);
      const v=rk.dice.reduce((s,d)=>s+1+Math.floor(Math.random()*d),0)+rk.bonus;
      box.textContent=v;beep(880,.35,'triangle',.2);shake();burst(innerWidth/2,innerHeight/2,60);
      setTimeout(()=>{ov.classList.remove('show');move(ti,v)},900);}
  },70);
}

/* ---- 이동 (지나가도 멈춤 / 나라는 한 번만) ---- */
function move(ti,steps){
  state.teams[ti].rolled=true;
  let left=steps;
  const step=()=>{
    const t=state.teams[ti];
    if(left<=0||t.pos>=GOAL)return arrive(ti);
    t.pos++;left--;place(ti,t.pos);
    tokens[ti].classList.add('hop');beep(600,.06,'sine',.1);
    setTimeout(()=>tokens[ti].classList.remove('hop'),160);
    const ct=countryAt(t.pos);
    if(ct){
      tiles[t.pos].classList.add('visited');
      const again=state.found.includes(ct.code);   // 두 번째부터는 '또 만났어요'
      if(!again){state.found.push(ct.code);}
      save();buildPanel();
      setTimeout(()=>showCard(ct,again,()=>setTimeout(step,320)),380);
      return;
    }
    setTimeout(step,320);
  };
  step();
}
function arrive(ti){
  const p=state.teams[ti].pos;
  if(p===GOAL){tiles[p].classList.add('visited');fanfare();
    burst(innerWidth/2,innerHeight*.4,140);shake();}
  busy=false;refresh();save();
  if(state.teams.every(t=>t.pos===GOAL))allFinish();
}
function showCard(ct,again,cb){
  document.getElementById('cardFlag').innerHTML=flagHTML(ct.code);
  document.getElementById('cardName').textContent=(again?'또 만났어요! ':'')+ct.name;
  document.getElementById('cardHi').textContent=`"${ct.hi}"`;
  document.getElementById('cardFact').textContent=ct.fact;
  document.getElementById('cardPray').textContent=`🙏 ${ct.pray} 기도해요`;
  cardCB=cb||null;
  cardOv.classList.add('show');
  fanfare();burst(innerWidth/2,innerHeight*.35,110);
}
cardOv.onclick=()=>{cardOv.classList.remove('show');const c=cardCB;cardCB=null;if(c)c();};

  if(busy)return;busy=true;let i=0;

      tiles[GOAL].classList.add('visited');

        fanfare();shake();burst(innerWidth/2,innerHeight/2,200);},500);return;}
    if(state.teams[i].pos<GOAL){state.teams[i].pos=GOAL;place(i,GOAL);
      beep(700,.2,'triangle',.15);burst(innerWidth/2,innerHeight*.45,50);}
    i++;setTimeout(go,450);
  };go();

function askScore(i){

function zeroScore(i){

(function(){
  const orig = buildBig;
  buildBig = function(){
    orig.apply(this, arguments);
    document.querySelectorAll('.big').forEach((card, i) => {

      row.className = 'mbtns';

      const b = document.createElement('button');
      b.textContent = '✏️ 직접 입력';
      b.className = 'manualbtn';
      b.onclick = () => askScore(i);
      row.appendChild(b);

      const z = document.createElement('button');
      z.textContent = '↺ 0점';
      z.className = 'manualbtn zero';
      z.onclick = () => zeroScore(i);
      row.appendChild(z);

      card.appendChild(row);
    });
  };
})();
</script>
</html>
